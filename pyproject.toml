[project]
name = "minos"
version = "0.0.1.dev0"
description = "A desktop agent runtime where the model asks and the runtime decides."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Karthick" }]
keywords = ["agent", "policy", "capability", "desktop-automation", "rollback"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
cli = ["typer>=0.12"]
claude = ["anthropic>=0.40"]

# What the sandbox can import. Optional by design: the runtime itself has zero
# dependencies and that stays true. Without these the sandbox still works, and
# a task that needs one fails by naming it rather than with a traceback.
#   uv sync --extra sandbox
sandbox = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "pillow>=10.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdown>=3.5",
    "pyyaml>=6.0",
    "chardet>=5.2",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
minos = "minos.__main__:main"

[project.urls]
Homepage = "https://github.com/mks2122/minos"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/minos"]

# anthropic is an optional extra. A checkout without it must still typecheck.
[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true
