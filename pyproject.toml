[project]
name = "writ"
version = "0.0.1.dev0"
description = "A desktop agent runtime where the model asks and the runtime decides."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Karthick" }]
keywords = ["agent", "policy", "capability", "desktop-automation", "rollback"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
cli = ["typer>=0.12"]
claude = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/OWNER/writ"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/writ"]

# anthropic is an optional extra. A checkout without it must still typecheck.
[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true
