name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Portability is enforced by CI, not by intentions. All three platforms from the
# first commit, while fixing a break still costs minutes.
jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Sync
        run: uv sync --all-extras --python ${{ matrix.python }}

      - name: Test
        run: uv run --python ${{ matrix.python }} pytest -q --junitxml=junit.xml

      # Logs need a signed-in account to read; annotations do not. Name the
      # failing tests where anyone can see them.
      - name: Report failing tests
        if: failure()
        run: uv run --python ${{ matrix.python }} python .github/scripts/report_failures.py junit.xml

      # The reference solutions must keep passing, or the suite has stopped
      # measuring anything. Also checks per-task regressions, not just the rate.
      - name: Eval (reference planner)
        run: >
          uv run --python ${{ matrix.python }} python -m minos.evals
          --baseline eval/baseline-scripted.json

  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Ruff (lint)
        run: uv run ruff check src tests
      - name: Ruff (format)
        run: uv run ruff format --check src tests
      # Once per platform. This job runs on Linux, and a Windows-only ctypes call
      # typechecks on Windows and fails here -- or the reverse -- so checking only
      # the host platform let 22 errors through unnoticed.
      - name: Mypy (strict, linux)
        run: uv run mypy --platform linux
      - name: Mypy (strict, darwin)
        run: uv run mypy --platform darwin
      - name: Mypy (strict, win32)
        run: uv run mypy --platform win32
